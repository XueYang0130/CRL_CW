mode: continual
method: jsrl_continual
run_name: jsrl_continual_cw10_seed0
output_dir: outputs/jsrl_continual

seed: 0
device: cpu
env_version: v3

sequence_task_count: 10
steps_per_task: 1000000
eval_every: 20000
det_eval_episodes: 1
stoch_eval_episodes: 10
best_return_eval_episodes: 5

batch_size: 128
replay_size: 1000000
start_steps: 10000
update_after: 1000
update_every: 50

learning_rate: 0.001
gamma: 0.99
polyak: 0.995
target_output_std: 0.089
