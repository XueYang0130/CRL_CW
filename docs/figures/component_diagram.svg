  <text x="612" y="505" class="sub">General Labels</text>
  <text x="595" y="535" class="sub">Task-specific Labels</text>
  <text x="610" y="565" class="sub">task_aware_v3</text>

  <rect x="950" y="410" width="360" height="190" rx="24" class="boxC"/>
