  <path d="M350 225 C385 225, 395 225, 430 225" class="arrow"/>
  <path d="M700 225 C740 225, 748 225, 790 225" class="arrow"/>
  <path d="M1210 225 C1248 225, 1260 225, 1300 225" class="arrow"/>

  <path d="M440 505 C475 505, 490 505, 530 505" class="arrow"/>
  <path d="M880 505 C910 505, 920 505, 950 505" class="arrow"/>
  <path d="M1310 505 C1340 505, 1350 505, 1390 505" class="arrow dash"/>

  <path d="M1130 600 C1110 660, 980 685, 920 700" class="arrow"/>
  <path d="M530 600 C500 665, 420 700, 430 740" class="arrow"/>
  <path d="M1390 600 C1355 665, 1320 690, 1300 740" class="arrow dash"/>
  <path d="M600 800 C640 800, 650 800, 700 800" class="arrow"/>
  <path d="M1120 800 C1160 800, 1180 800, 1240 800" class="arrow"/>

  <text x="90" y="1010" class="sub">Solid modules: confirmed implementation components</text>
  <text x="760" y="1010" class="sub">Dashed red module: evolving design space</text>
